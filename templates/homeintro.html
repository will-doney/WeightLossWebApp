<link rel="stylesheet" href="{{ url_for('static', filename='css/welcomenewuser.css') }}">

<div class="welcome-container">

    <!-- INITIAL AVATAR + FIRST TITLE -->
    <img src="{{ url_for('static', filename='images/avatar_logo.png') }}" class="avatar" id="avatar">
    <h1 class="main-title" id="mainTitle">WeightGame</h1>

    <!-- PAGE 2 CONTENT -->
    <h1 class="top-title" id="topTitle">WeightGame</h1>

    <div class="welcome-text" id="welcomeText">Welcome to WeightGame</div>

    <div class="subtitle" id="subtitle">
        Small changes into Big changes.<br>Your future starts here!
    </div>

    <div class="page2-buttons hidden" id="page2Buttons">
        <a href="{{ url_for('signup') }}" class="page2-btn">Get Started</a>
        <a href="{{ url_for('login') }}" class="page2-btn secondary">I already have an account</a>
    </div>

    <!-- FLOATING DECORATIONS (only for page 2) -->
    <div class="float-symbol" style="top: 20%; left: 15%;">⭐</div>
    <div class="float-symbol" style="top: 70%; left: 80%;">✨</div>
    <div class="float-symbol" style="top: 40%; left: 60%;">⚡</div>

</div>

<script>
  // After 2 seconds, transition to second scene
  setTimeout(() => {
      // Hide avatar + main title
      document.getElementById("avatar").style.display = "none";
      document.getElementById("mainTitle").style.display = "none";

      // Show top title
      const topTitle = document.getElementById("topTitle");
      topTitle.style.opacity = "1";

      // Show welcome text + subtitle
      document.getElementById("welcomeText").style.opacity = "1";
      document.getElementById("subtitle").style.opacity = "1";

      // Show buttons only now
      const buttons = document.getElementById('page2Buttons');
      buttons.classList.add('show');

  }, 2000);
</script>
