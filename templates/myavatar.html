{# myavatar.html - Avatar customization with mood switching and points tracking #}
{% extends 'base.html' %}

{% block content %}
  <h2 class="section-title">Avatar Page</h2>
  <p class="muted">Choose your avatar mood below.</p>

  <div class="avatar-container">
    <div class="avatar-wrapper">
      <img 
        id="avatar-image"
        src="{{ url_for('static', filename='avatars/avatar_happy.png') }}" 
        alt="Avatar" 
        class="avatar-image"
        width="240" height="240"
      />
      <div id="level-badge" class="level-badge">Lv 1</div>
    </div>

    <div class="progress-wrap" aria-hidden="false">
      <div class="progress-bg" role="progressbar" aria-label="Avatar level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="points-text" class="points-text">0 / 100 points</div>
    </div>
  </div>

  <div class="mood-buttons">
    <button onclick="changeAvatar('happy')" class="btn">😊 Happy</button>
    <button onclick="changeAvatar('sad')" class="btn">😢 Sad</button>
    <button onclick="changeAvatar('fit')" class="btn">🏃 Fit</button>
  </div>

  <div class="points-actions">
    <button onclick="addPoints(10)" class="btn">+10 pts</button>
    <button onclick="addPoints(50)" class="btn">+50 pts</button>
    <button onclick="resetPoints()" class="btn">Reset</button>
  </div>

  <script>
    // Change avatar image based on mood selection
    function changeAvatar(mood) {
      if (!mood) mood = 'happy';
      if (mood === 'neutral') mood = 'happy';
      const avatarImage = document.getElementById('avatar-image');
      const allowed = ['happy','sad','fit'];
      if (!allowed.includes(mood)) mood = 'happy';
      avatarImage.src = `/static/avatars/avatar_${mood}.png`;
    }
    
    // Avatar points and level system with localStorage and server sync
    (function () {
      const USER_ID = '{{ session.get("user_id", "anon") }}';
      const STORAGE_KEY = `avatar_points_v1_${USER_ID}`;

      const GLOBAL_KEY = 'avatar_points_v1';
      if (!localStorage.getItem(STORAGE_KEY) && localStorage.getItem(GLOBAL_KEY)) {
        try {
          localStorage.setItem(STORAGE_KEY, localStorage.getItem(GLOBAL_KEY));
        } catch (e) {
        }
      }
      const pointsPerLevel = 100;
      const MOOD_KEY = `avatar_mood_v1_${USER_ID}`;
      const GLOBAL_MOOD_KEY = 'avatar_mood_v1';

      if (!localStorage.getItem(MOOD_KEY) && localStorage.getItem(GLOBAL_MOOD_KEY)) {
        try { localStorage.setItem(MOOD_KEY, localStorage.getItem(GLOBAL_MOOD_KEY)); } catch (e) {}
      }

      try {
        const currentMood = localStorage.getItem(MOOD_KEY) || localStorage.getItem(GLOBAL_MOOD_KEY);
        if (currentMood) changeAvatar(currentMood);
      } catch (e) {
      }

      let points = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);

      // Fetch canonical points from server and sync with localStorage
      fetch('/api/avatar/points', { method: 'GET', headers: { 'Accept': 'application/json' } })
        .then(res => res.json())
        .then(data => {
          if (data && typeof data.points === 'number') {
            try {
              const serverPoints = Number(data.points) || 0;
                  const localPoints = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
              if (serverPoints > localPoints) {
                points = serverPoints;
                localStorage.setItem(STORAGE_KEY, String(points));
                updateUI();
              }
            } catch (err) {
            }
          }
        }).catch(() => {
        });

      const progressFill = document.getElementById('progress-fill');
      const pointsText = document.getElementById('points-text');
      const levelBadge = document.getElementById('level-badge');
      const progressBg = document.querySelector('.progress-bg');

      // Calculate level from total points (100 points per level)
      function computeLevel(p) {
        return Math.floor(p / pointsPerLevel) + 1;
      }

      // Update UI with current points, level, and progress bar
      function updateUI() {
        const level = computeLevel(points);
        const progressInLevel = points % pointsPerLevel;
        const percent = Math.round((progressInLevel / pointsPerLevel) * 100);

        levelBadge.textContent = `Lv ${level}`;
        progressFill.style.width = percent + '%';
        progressBg.setAttribute('aria-valuenow', String(percent));
        pointsText.textContent = `${progressInLevel} / ${pointsPerLevel} points (Total: ${points})`;
      }

      // Add points and persist to server
      window.addPoints = function (n) {
        points = Math.max(0, points + Number(n || 0));
        localStorage.setItem(STORAGE_KEY, String(points));
        updateUI();

        fetch('/api/avatar/points', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ points })
        }).then(res => res.json()).then(data => {
          if (data && data.ok) return;
          if (data && data.error) console.warn('Persist points error:', data.error);
        }).catch(err => console.warn('Persist points failed', err));
      };

      window.resetPoints = function () {
        points = 0;
        localStorage.setItem(STORAGE_KEY, '0');
        updateUI();

        fetch('/api/avatar/points', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ points })
        }).catch(err => console.warn('Persist points failed', err));
      };

     


      // Sync points and mood across browser tabs via localStorage events
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY || e.key === GLOBAL_KEY) {
          try {
            points = parseInt(e.newValue || '0', 10) || 0;
            updateUI();
          } catch (err) {
          }
        }

        if (e.key === MOOD_KEY || e.key === GLOBAL_MOOD_KEY) {
          try {
            const mood = e.newValue || '';
            if (mood) changeAvatar(mood);
          } catch (err) {
          }
        }
      });

      updateUI();
    })();
  </script>
 {% endblock %}
