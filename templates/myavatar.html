{# myavatar.html - Avatar customization with mood switching and points tracking #}
{% extends 'base.html' %}

{% block content %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/avatar-borders.css') }}">
  <h2 class="section-title">Avatar Page</h2>
  <p class="muted">Level up to unlock new avatars. Borders show milestones.</p>

  <!-- Main Grid Layout: Avatar Left, Unlockables Right -->
  <div class="avatar-page-grid">
    
    <!-- Left Side: Current Avatar -->
    <div class="avatar-section">
      <h3>Your Avatar</h3>
      <div class="avatar-container">
        <div class="avatar-wrapper">
          <img 
            id="avatar-image"
            src="{{ url_for('static', filename='avatars/avatar_happy.png') }}" 
            alt="Avatar" 
            class="avatar-image"
            width="240" height="240"
          />
          <div id="level-badge" class="level-badge">Lv 1</div>
        </div>

        <div class="progress-wrap" aria-hidden="false">
          <div class="progress-bg" role="progressbar" aria-label="Avatar level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div id="points-text" class="points-text">0 / 100 points</div>
        </div>
      </div>

      

      <div class="points-actions">
        <button onclick="addPoints(10)" class="btn">+10 pts</button>
        <button onclick="addPoints(50)" class="btn">+50 pts</button>
        <button onclick="resetPoints()" class="btn">Reset</button>
      </div>
    </div>

    <!-- Right Side: Unlockable Avatars -->
    <div class="unlockables-section">
      <h3>🔓 Unlock New Avatars</h3>
      <div id="unlockables-container">
        <!-- Unlockable avatars will be rendered here -->
      </div>
    </div>

  </div>

  <!-- Bottom: Milestones & Rewards -->
  <div class="milestones-section">
    <h3>Milestones & Rewards</h3>
    <div id="milestones-container"></div>
  </div>

  <script>
    // Unlockable avatars data
    const UNLOCKABLE_AVATARS = [
      { id: 'champion',   name: 'Champion Avatar',   emoji: '🏆', level: 5,  unlocked: false, description: 'Unlock at Level 5'  },
      { id: 'legendary',  name: 'Legendary Avatar',  emoji: '🏅', level: 10, unlocked: false, description: 'Unlock at Level 10' },
      { id: 'mythic',     name: 'Mythic Avatar',     emoji: '✨', level: 15, unlocked: false, description: 'Unlock at Level 15' },
      { id: 'elite',      name: 'Elite Avatar',      emoji: '🛡️', level: 20, unlocked: false, description: 'Unlock at Level 20' },
      { id: 'prime',      name: 'Prime Avatar',      emoji: '🔱', level: 25, unlocked: false, description: 'Unlock at Level 25' },
      { id: 'ascendant',  name: 'Ascendant Avatar',  emoji: '🌟', level: 30, unlocked: false, description: 'Unlock at Level 30' }
    ];

    // Render unlockable avatars
    function renderUnlockables() {
      const container = document.getElementById('unlockables-container');
      const currentLevel = computeLevel(parseInt(localStorage.getItem('avatar_points_v1_{{ session.get("user_id", "anon") }}') || '0', 10));
      
      const html = UNLOCKABLE_AVATARS.map(avatar => {
        const isUnlocked = currentLevel >= avatar.level;
        return `
          <div class="unlockable-card ${isUnlocked ? 'unlocked' : 'locked'}">
            <div class="unlockable-icon">${avatar.emoji}</div>
            <div class="unlockable-info">
              <h4>${avatar.name}</h4>
              <p class="unlockable-desc">${avatar.description}</p>
            </div>
            ${isUnlocked 
              ? `<span class="unlock-status unlocked-status">✓ Unlocked</span>` 
              : `<span class="unlock-status locked-status">🔒 Lv ${avatar.level}</span>`
            }
          </div>
        `;
      }).join('');
      
      container.innerHTML = html;
    }

    // Helper to compute level from points
    function computeLevel(points) {
      return Math.floor(points / 100) + 1;
    }
    // Change avatar border
    function changeBorder(border) {
      const wrapper = document.querySelector('.avatar-wrapper');
      if (!wrapper) return;
      
      // Remove all border classes
      wrapper.classList.remove('border-bronze', 'border-silver', 'border-gold', 'border-platinum', 'border-diamond', 'border-none');
      
      // Add selected border
      if (border && border !== 'none') {
        wrapper.classList.add('border-' + border);
      } else {
        wrapper.classList.add('border-none');
      }
    }

    // Change avatar image based on mood selection
    function changeAvatar(mood) {
      if (!mood) mood = 'happy';
      if (mood === 'neutral') mood = 'happy';
      const avatarImage = document.getElementById('avatar-image');
      const allowed = ['happy','sad','fit'];
      if (!allowed.includes(mood)) mood = 'happy';
      avatarImage.src = `/static/avatars/avatar_${mood}.png`;
    }
    
    // Avatar points and level system with localStorage and server sync
    (function () {
      const USER_ID = '{{ session.get("user_id", "anon") }}';
      const STORAGE_KEY = `avatar_points_v1_${USER_ID}`;

      const GLOBAL_KEY = 'avatar_points_v1';
      if (!localStorage.getItem(STORAGE_KEY) && localStorage.getItem(GLOBAL_KEY)) {
        try {
          localStorage.setItem(STORAGE_KEY, localStorage.getItem(GLOBAL_KEY));
        } catch (e) {
        }
      }
      const pointsPerLevel = 100;
      const MOOD_KEY = `avatar_mood_v1_${USER_ID}`;
      const GLOBAL_MOOD_KEY = 'avatar_mood_v1';

      if (!localStorage.getItem(MOOD_KEY) && localStorage.getItem(GLOBAL_MOOD_KEY)) {
        try { localStorage.setItem(MOOD_KEY, localStorage.getItem(GLOBAL_MOOD_KEY)); } catch (e) {}
      }

      try {
        const currentMood = localStorage.getItem(MOOD_KEY) || localStorage.getItem(GLOBAL_MOOD_KEY);
        if (currentMood) changeAvatar(currentMood);
      } catch (e) {
      }

      let points = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);

      // Fetch canonical points from server and sync with localStorage
      fetch('/api/avatar/points', { method: 'GET', headers: { 'Accept': 'application/json' } })
        .then(res => res.json())
        .then(data => {
          if (data && typeof data.points === 'number') {
            try {
              const serverPoints = Number(data.points) || 0;
                  const localPoints = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
              if (serverPoints > localPoints) {
                points = serverPoints;
                localStorage.setItem(STORAGE_KEY, String(points));
                updateUI();
              }
            } catch (err) {
            }
          }
        }).catch(() => {
        });

      const progressFill = document.getElementById('progress-fill');
      const pointsText = document.getElementById('points-text');
      const levelBadge = document.getElementById('level-badge');
      const progressBg = document.querySelector('.progress-bg');

      // Calculate level from total points (100 points per level)
      function computeLevel(p) {
        return Math.floor(p / pointsPerLevel) + 1;
      }

      // Update UI with current points, level, and progress bar
      function updateUI() {
        const level = computeLevel(points);
        const progressInLevel = points % pointsPerLevel;
        const percent = Math.round((progressInLevel / pointsPerLevel) * 100);

        levelBadge.textContent = `Lv ${level}`;
        progressFill.style.width = percent + '%';
        progressBg.setAttribute('aria-valuenow', String(percent));
        pointsText.textContent = `${progressInLevel} / ${pointsPerLevel} points (Total: ${points})`;
        
        // Update unlockables when level changes
        renderUnlockables();
      }

      // Add points and persist to server
      window.addPoints = function (n) {
        points = Math.max(0, points + Number(n || 0));
        localStorage.setItem(STORAGE_KEY, String(points));
        updateUI();

        fetch('/api/avatar/points', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ points })
        }).then(res => res.json()).then(data => {
          if (data && data.ok) return;
          if (data && data.error) console.warn('Persist points error:', data.error);
        }).catch(err => console.warn('Persist points failed', err));
      };

      window.resetPoints = function () {
        points = 0;
        localStorage.setItem(STORAGE_KEY, '0');
        updateUI();

        fetch('/api/avatar/points', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ points })
        }).catch(err => console.warn('Persist points failed', err));
      };

     


      // Sync points and mood across browser tabs via localStorage events
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY || e.key === GLOBAL_KEY) {
          try {
            points = parseInt(e.newValue || '0', 10) || 0;
            updateUI();
          } catch (err) {
          }
        }

        if (e.key === MOOD_KEY || e.key === GLOBAL_MOOD_KEY) {
          try {
            const mood = e.newValue || '';
            if (mood) changeAvatar(mood);
          } catch (err) {
          }
        }
      });

      updateUI();
      
      // Initial render of unlockables
      renderUnlockables();
    })();

    // ============================================================
    // Milestones & Rewards System
    // ============================================================
    (function () {
      const milestonesContainer = document.getElementById('milestones-container');

      // Fetch milestones and render
      function loadMilestones() {
        fetch('/api/avatar/rewards', { method: 'GET', headers: { 'Accept': 'application/json' } })
          .then(res => res.json())
          .then(data => {
            const milestones = data.milestones || [];
            const claimed = data.claimed || [];
            renderMilestones(milestones, claimed);
            
            // Auto-apply border based on highest claimed milestone from Firestore
            updateBorderFromClaimed(claimed);
          })
          .catch(err => {
            console.error('Failed to load milestones:', err);
            milestonesContainer.innerHTML = '<p class="muted">Unable to load milestones</p>';
          });
      }

      // Update avatar border based on highest claimed milestone
      function updateBorderFromClaimed(claimedIds) {
        // Border mapping in order of priority (lowest to highest)
        const borderPriority = [
          { id: 'm50', border: 'bronze' },
          { id: 'm100', border: 'silver' },
          { id: 'm250', border: 'gold' },
          { id: 'm500', border: 'platinum' },
          { id: 'm1000', border: 'diamond' }
        ];
        
        // Find highest tier claimed
        let highestBorder = null;
        for (const tier of borderPriority) {
          if (claimedIds.includes(tier.id)) {
            highestBorder = tier.border;
          }
        }
        
        // Apply the border (or none if nothing claimed)
        if (highestBorder) {
          changeBorder(highestBorder);
        } else {
          changeBorder('none');
        }
      }

      // Render milestone cards
      function renderMilestones(milestones, claimed) {
        if (!milestones.length) {
          milestonesContainer.innerHTML = '<p class="muted">No milestones available</p>';
          return;
        }

        const currentPoints = parseInt(localStorage.getItem('avatar_points_v1_{{ session.get("user_id", "anon") }}') || '0', 10);

        const html = milestones.map(m => {
          const isClaimed = claimed.includes(m.id);
          const canClaim = currentPoints >= m.pts && !isClaimed;
          const progress = Math.min(100, (currentPoints / m.pts) * 100);

          return `
            <div class="milestone ${isClaimed ? 'claimed' : ''}">
              <div class="milestone-header">
                <h4>${m.title}</h4>
                <span class="milestone-points">${m.pts} pts</span>
              </div>
              <div class="milestone-progress">
                <div class="milestone-fill" style="width: ${progress}%"></div>
              </div>
              <div class="milestone-reward">
                <span class="reward-badge ${isClaimed ? '' : 'locked'}">${m.reward}</span>
                ${isClaimed 
                  ? '<span class="claimed-label">✓ Claimed</span>' 
                  : canClaim 
                    ? `<button class="claim-btn" onclick="claimReward('${m.id}')">Claim Reward</button>`
                    : `<span class="muted">${currentPoints}/${m.pts}</span>`
                }
              </div>
            </div>
          `;
        }).join('');

        milestonesContainer.innerHTML = html;
      }

      // Claim reward
      window.claimReward = function (rewardId) {
        fetch('/api/avatar/rewards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reward_id: rewardId })
        })
          .then(res => res.json())
          .then(data => {
            if (data.ok) {
              alert('Reward claimed successfully! 🎉');
              
              // Auto-apply border based on milestone tier
              const borderMap = {
                'm50': 'bronze',    // First Steps
                'm100': 'silver',   // On The Move
                'm250': 'gold',     // Committed
                'm500': 'platinum', // Halfway Hero
                'm1000': 'diamond'  // Legend
              };
              
              if (borderMap[rewardId]) {
                changeBorder(borderMap[rewardId]);
              }
              
              loadMilestones(); // Refresh
            } else if (data.error === 'already_claimed') {
              alert('You already claimed this reward!');
            } else if (data.error === 'insufficient_points') {
              alert(`Need ${data.required} points (you have ${data.have})`);
            } else {
              alert('Failed to claim reward: ' + (data.error || 'Unknown error'));
            }
          })
          .catch(err => {
            console.error('Claim error:', err);
            alert('Network error - please try again');
          });
      };

      // Listen for points changes to update progress bars
      window.addEventListener('storage', function (e) {
        if (e.key && e.key.includes('avatar_points_v1')) {
          loadMilestones();
        }
      });

      // Initial load
      loadMilestones();
    })();
  </script>
 {% endblock %}
