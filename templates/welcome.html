{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/welcome_homeintro.css') }}">

<!-- Hide site header/footer while intro shows -->
<style>
  header.site-header, footer.site-footer { display: none !important; }
</style>

<div class="wh-wrapper wh-welcome">
  <div class="wh-center">
    <img src="{{ url_for('static', filename='avatars/avatar_logo.png') }}" alt="Avatar" class="wh-avatar" id="whAvatar">
    <h1 class="wh-title" id="whTitle">WeightGame</h1>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const avatar = document.getElementById('whAvatar');
  const title = document.getElementById('whTitle');

  // timings
  const stay = 1800;      // how long to keep visible (ms)
  const snapDuration = 100; // instant snap (ms)

  // leave visible for `stay` ms, then instant snap-out and redirect
  setTimeout(() => {
    // apply snap-out CSS class
    avatar.classList.add('wh-snap-out');
    title.classList.add('wh-snap-out');

    // after the snap duration, redirect to /homeintro
    setTimeout(() => {
      window.location.href = "{{ url_for('homeintro') }}";
    }, snapDuration + 30);
  }, stay);
});
</script>

{% endblock %}
